# AprismJDK version tracking
# Format: v<MAJOR>.<MINOR>[-Alpha.<N>]
# MAJOR = calendar year (26 = 2026)
# MINOR = feature line (0, 1, 2...)
# Alpha.N = pre-release number (1-9)
# Bare version (no suffix) = GA release

aprismjdkVersion=v26.1-Alpha.3

# Upstream OpenJDK version tracking
# AprismJDK v26.x tracks OpenJDK 25 LTS
openjdkVersion=25
openjdkUpdate=0
openjdkBuild=0

# Build metadata
buildTimestamp=2026-08-11

# Dependency versions
asmVersion=9.7.1
junitVersion=5.10.2
assertjVersion=3.25.3

# Distribution metadata
distributionName=AprismJDK
distributionVendor=AprismLab
distributionUrl=https://github.com/AprismLab/AprismJDK
