plugins {
    id 'java-library'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

dependencies {
    implementation project(':aprismate-api')
    implementation "org.ow2.asm:asm:${asmVersion}"
    implementation "org.ow2.asm:asm-commons:${asmVersion}"
    implementation "org.ow2.asm:asm-tree:${asmVersion}"
    implementation "org.ow2.asm:asm-util:${asmVersion}"
    
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
}

ext.agentManifest = [
    'Premain-Class': 'com.aprismate.agent.AprismateAgent',
    'Agent-Class': 'com.aprismate.agent.AprismateAgent',
    'Can-Redefine-Classes': 'true',
    'Can-Retransform-Classes': 'true',
    'Can-Set-Native-Method-Prefix': 'true',
    'Implementation-Title': 'AprismateAgent',
    'Implementation-Version': project.version,
    'Implementation-Vendor': 'AprismLab'
]

jar {
    manifest { attributes(agentManifest) }
}

// Self-contained agent jar for image embedding and stock-JDK attach.
// Bundles aprismate-api classes so premain class-linking succeeds even
// when the jdk.aprismate module is absent (stock fallback tier).
// ASM is declared but unused at runtime; excluded to keep the jar lean.
tasks.register('embedJar', Jar) {
    archiveFileName = 'aprismate.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes(agentManifest) }
    from(sourceSets.main.output)
    def apiProject = project(':aprismate-api')
    dependsOn apiProject.tasks.named('jar')
    from({
        zipTree(apiProject.tasks.named('jar').flatMap { it.archiveFile })
    }) {
        exclude 'module-info.class'
    }
}

shadowJar {
    archiveClassifier.set('all')
    archiveBaseName.set('aprismate-agent')
    // Temporarily disable ASM relocation due to Java 21 compatibility issues
    // This will be re-enabled once we upgrade to a compatible Shadow version
    // relocate 'org.objectweb.asm', 'com.aprismate.agent.shadow.asm'
    
    manifest {
        inheritFrom jar.manifest
    }
}

// For v26.0-Alpha.1, we'll use regular jar instead of shadowJar
// shadowJar will be re-enabled in v26.0-Alpha.2
