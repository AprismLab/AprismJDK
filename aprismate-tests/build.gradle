plugins {
    id 'java-library'
}

dependencies {
    testImplementation project(':aprismate-agent')
    testImplementation project(':aprismate-api')
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testImplementation "org.mockito:mockito-core:5.11.0"
    testImplementation "org.mockito:mockito-junit-jupiter:5.11.0"
    testImplementation "org.ow2.asm:asm:${asmVersion}"
    testImplementation "org.ow2.asm:asm-commons:${asmVersion}"
    testImplementation "org.ow2.asm:asm-tree:${asmVersion}"
    testImplementation "org.ow2.asm:asm-util:${asmVersion}"
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = false
    }
    
    // Agent tests require special JVM flags
    jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED'
    jvmArgs '--add-opens=java.base/java.lang.instrument=ALL-UNNAMED'
}
